<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="470" fill="#f8f9fa"/>
  <rect x="20" y="20" width="860" height="430" rx="12" fill="#ffffff" stroke="#dee2e6"/>

  <!-- Toolbar -->
  <text x="45" y="52" font-size="12" font-weight="500" fill="#212529">Search Admins</text>
  <rect x="45" y="58" width="260" height="30" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <text x="57" y="77" font-size="11" fill="#adb5bd">Search name of an admin</text>

  <rect x="545" y="58" width="150" height="30" rx="6" fill="#00595c"/>
  <text x="620" y="77" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">📄  Export to Excel</text>
  <rect x="705" y="58" width="150" height="30" rx="6" fill="#d3f9d8"/>
  <text x="780" y="77" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle">+ Add Planned Activity</text>

  <text x="45" y="105" font-size="9" font-weight="700" fill="#868e96">ℹ️ Long press BLK &amp; LOT cell to remove an activity · Click a cell, then use arrow keys to move and Enter to edit</text>

  <!-- Table header row 1 -->
  <g font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="45" y="118" width="36" height="44" fill="#00595c" stroke="#0b6d70"/>
    <text x="63" y="144">NO</text>
    <rect x="81" y="118" width="80" height="44" fill="#00595c" stroke="#0b6d70"/>
    <text x="121" y="144">SKILLS</text>
    <rect x="161" y="118" width="150" height="44" fill="#00595c" stroke="#0b6d70"/>
    <text x="236" y="144">NAME</text>
    <rect x="311" y="118" width="544" height="22" fill="#00595c" stroke="#0b6d70"/>
    <text x="583" y="133">Activity 1</text>
    <!-- Sub headers -->
    <rect x="311" y="140" width="110" height="22" fill="#00595c" stroke="#0b6d70"/>
    <text x="366" y="155">Blk &amp; Lot</text>
    <rect x="421" y="140" width="90" height="22" fill="#00595c" stroke="#0b6d70"/>
    <text x="466" y="155">TimeIn</text>
    <rect x="511" y="140" width="90" height="22" fill="#00595c" stroke="#0b6d70"/>
    <text x="556" y="155">TimeOut</text>
    <rect x="601" y="140" width="110" height="22" fill="#00595c" stroke="#0b6d70"/>
    <text x="656" y="155">Activity</text>
    <rect x="711" y="140" width="144" height="22" fill="#00595c" stroke="#0b6d70"/>
    <text x="783" y="155">Justification</text>
  </g>

  <!-- Row 1: complete -->
  <g font-size="10" text-anchor="middle">
    <rect x="45" y="162" width="36" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="63" y="186" fill="#495057">1</text>
    <rect x="81" y="162" width="80" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="121" y="186" fill="#495057">MASON</text>
    <rect x="161" y="162" width="150" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="230" y="186" fill="#212529">Juan Dela Cruz  🗑</text>
    <rect x="311" y="162" width="110" height="40" fill="#e8f5e9" stroke="#e9ecef"/>
    <text x="366" y="181" fill="#212529" font-weight="600">12 / 0004</text>
    <text x="366" y="195" fill="#12b886" font-weight="700" font-size="9">#3041</text>
    <rect x="421" y="162" width="90" height="40" fill="#e3f2fd" stroke="#e9ecef"/>
    <text x="466" y="186" fill="#212529" font-weight="600">07:00</text>
    <rect x="511" y="162" width="90" height="40" fill="#e3f2fd" stroke="#e9ecef"/>
    <text x="556" y="186" fill="#212529" font-weight="600">15:00</text>
    <rect x="601" y="162" width="110" height="40" fill="#e8f5e9" stroke="#e9ecef"/>
    <text x="656" y="186" fill="#212529" font-weight="700">CHB-104</text>
    <rect x="711" y="162" width="144" height="40" fill="#ffffff" stroke="#e9ecef"/>
    <text x="783" y="186" fill="#adb5bd">—</text>
  </g>

  <!-- Row 2: needs justification (timeout past 16:00) -->
  <g font-size="10" text-anchor="middle">
    <rect x="45" y="202" width="36" height="40" fill="#ffffff" stroke="#e9ecef"/>
    <text x="63" y="226" fill="#495057">2</text>
    <rect x="81" y="202" width="80" height="40" fill="#ffffff" stroke="#e9ecef"/>
    <text x="121" y="226" fill="#495057">CARPENTER</text>
    <rect x="161" y="202" width="150" height="40" fill="#ffffff" stroke="#e9ecef"/>
    <text x="230" y="226" fill="#212529">Maria Reyes  🗑</text>
    <rect x="311" y="202" width="110" height="40" fill="#e8f5e9" stroke="#e9ecef"/>
    <text x="366" y="226" fill="#212529" font-weight="600">08 / 0011</text>
    <rect x="421" y="202" width="90" height="40" fill="#e3f2fd" stroke="#e9ecef"/>
    <text x="466" y="226" fill="#212529" font-weight="600">08:00</text>
    <rect x="511" y="202" width="90" height="40" fill="#e3f2fd" stroke="#e9ecef"/>
    <text x="556" y="226" fill="#212529" font-weight="600">17:30</text>
    <rect x="601" y="202" width="110" height="40" fill="#e8f5e9" stroke="#e9ecef"/>
    <text x="656" y="226" fill="#212529" font-weight="700">RSB-210</text>
    <rect x="711" y="202" width="144" height="40" fill="#fff3bf" stroke="#e9ecef"/>
    <text x="783" y="226" fill="#c92a2a" font-weight="700" font-size="9">Justification required</text>
  </g>

  <!-- Row 3: overlap + empty cells -->
  <g font-size="10" text-anchor="middle">
    <rect x="45" y="242" width="36" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="63" y="266" fill="#495057">3</text>
    <rect x="81" y="242" width="80" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="121" y="266" fill="#495057">LABORER</text>
    <rect x="161" y="242" width="150" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="230" y="266" fill="#212529">Pedro Santos  🗑</text>
    <rect x="311" y="242" width="110" height="40" fill="#fff9c4" stroke="#e9ecef"/>
    <text x="366" y="266" fill="#adb5bd">— set —</text>
    <rect x="421" y="242" width="90" height="40" fill="#ffc9c9" stroke="#e9ecef"/>
    <text x="466" y="266" fill="#c92a2a" font-weight="700">07:00</text>
    <rect x="511" y="242" width="90" height="40" fill="#ffc9c9" stroke="#e9ecef"/>
    <text x="556" y="266" fill="#c92a2a" font-weight="700">09:00</text>
    <rect x="601" y="242" width="110" height="40" fill="#fff9c4" stroke="#e9ecef"/>
    <text x="656" y="266" fill="#adb5bd">— set —</text>
    <rect x="711" y="242" width="144" height="40" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="783" y="266" fill="#adb5bd">—</text>
  </g>

  <!-- Legend -->
  <text x="45" y="315" font-size="12" font-weight="700" fill="#212529">Cell color legend</text>
  <g font-size="11" fill="#495057">
    <rect x="45" y="326" width="16" height="16" rx="3" fill="#fff9c4" stroke="#dee2e6"/>
    <text x="68" y="338">Yellow — required, not yet filled (click to set)</text>
    <rect x="45" y="350" width="16" height="16" rx="3" fill="#e8f5e9" stroke="#dee2e6"/>
    <text x="68" y="362">Green — Blk &amp; Lot / Activity has been set</text>
    <rect x="45" y="374" width="16" height="16" rx="3" fill="#e3f2fd" stroke="#dee2e6"/>
    <text x="68" y="386">Blue — Time In / Time Out has been set</text>
    <rect x="45" y="398" width="16" height="16" rx="3" fill="#ffc9c9" stroke="#dee2e6"/>
    <text x="68" y="410">Red times — overlapping activities for the same admin (must be fixed)</text>

    <rect x="470" y="326" width="16" height="16" rx="3" fill="#fff3bf" stroke="#dee2e6"/>
    <text x="493" y="338">Amber — Time Out is past 16:00 and needs a justification</text>
    <rect x="470" y="350" width="16" height="16" rx="3" fill="#D51C39"/>
    <text x="493" y="362">Solid red — justification saved (hover to read the text)</text>
    <text x="470" y="386" fill="#12b886" font-weight="700">#3041</text>
    <text x="510" y="386">Teal number — record number returned by the server (already synced)</text>
  </g>
</svg>
