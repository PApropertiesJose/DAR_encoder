<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="430" fill="#f8f9fa"/>

  <!-- Modal -->
  <rect x="60" y="25" width="780" height="380" rx="12" fill="#ffffff" stroke="#dee2e6"/>
  <text x="85" y="60" font-size="15" font-weight="700" fill="#212529">Validation Result</text>
  <text x="815" y="58" font-size="13" fill="#adb5bd" text-anchor="end">✕</text>

  <!-- Summary badges -->
  <rect x="85" y="75" width="150" height="22" rx="11" fill="#e6fcf5"/>
  <text x="160" y="90" font-size="10" font-weight="700" fill="#0ca678" text-anchor="middle">✓ 4 already synced (#rn)</text>
  <rect x="245" y="75" width="180" height="22" rx="11" fill="#fff3bf"/>
  <text x="335" y="90" font-size="10" font-weight="700" fill="#e67700" text-anchor="middle">⚠ 1 justification required</text>
  <rect x="435" y="75" width="170" height="22" rx="11" fill="#ffe3e3"/>
  <text x="520" y="90" font-size="10" font-weight="700" fill="#c92a2a" text-anchor="middle">✕ 1 row missing input</text>

  <!-- Table -->
  <g font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="85" y="110" width="730" height="26" fill="#00595c"/>
    <text x="125" y="127">RN</text>
    <text x="230" y="127">Admin</text>
    <text x="355" y="127">Blk / Lot</text>
    <text x="445" y="127">Time In</text>
    <text x="520" y="127">Time Out</text>
    <text x="610" y="127">Activity</text>
    <text x="740" y="127">Justification</text>
  </g>

  <!-- Row 1: synced -->
  <g font-size="10" fill="#495057" text-anchor="middle">
    <rect x="85" y="136" width="730" height="30" fill="#ffffff" stroke="#2f9e44" stroke-width="1.5"/>
    <text x="125" y="155" fill="#2f9e44" font-weight="700">#3041</text>
    <text x="230" y="155">Juan Dela Cruz</text>
    <text x="355" y="155">12 / 0004</text>
    <text x="445" y="155">07:00</text>
    <text x="520" y="155">15:00</text>
    <text x="610" y="155">CHB-104</text>
    <text x="740" y="155">—</text>
  </g>

  <!-- Row 2: needs justification -->
  <g font-size="10" fill="#495057" text-anchor="middle">
    <rect x="85" y="166" width="730" height="30" fill="#fff9db" stroke="#e9ecef"/>
    <text x="125" y="185" fill="#adb5bd">0</text>
    <text x="230" y="185">Maria Reyes</text>
    <text x="355" y="185">08 / 0011</text>
    <text x="445" y="185">08:00</text>
    <text x="520" y="185">17:30</text>
    <text x="610" y="185">RSB-210</text>
    <text x="740" y="185" fill="#e67700" font-weight="700">⚠ overbudget</text>
  </g>

  <!-- Row 3: missing input -->
  <g font-size="10" fill="#495057" text-anchor="middle">
    <rect x="85" y="196" width="730" height="30" fill="#fff0f0" stroke="#e9ecef"/>
    <text x="125" y="215" fill="#adb5bd">0</text>
    <text x="230" y="215">Pedro Santos</text>
    <rect x="320" y="201" width="70" height="20" rx="4" fill="#ffc9c9"/>
    <text x="355" y="215" fill="#c92a2a" font-weight="700">missing</text>
    <text x="445" y="215">07:00</text>
    <text x="520" y="215">09:00</text>
    <rect x="575" y="201" width="70" height="20" rx="4" fill="#ffc9c9"/>
    <text x="610" y="215" fill="#c92a2a" font-weight="700">missing</text>
    <text x="740" y="215">—</text>
  </g>

  <!-- Justification textarea -->
  <text x="85" y="255" font-size="11" font-weight="600" fill="#212529">Justification for Maria Reyes — RSB-210 (Time Out 17:30)</text>
  <rect x="85" y="263" width="730" height="52" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <text x="97" y="285" font-size="11" fill="#495057">Rebar installation extended to finish column ties before concrete pour scheduled tomorrow.</text>

  <!-- Footer buttons -->
  <rect x="600" y="340" width="90" height="32" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <text x="645" y="360" font-size="11" fill="#495057" text-anchor="middle">Close</text>
  <rect x="700" y="340" width="115" height="32" rx="6" fill="#00595c"/>
  <text x="757" y="360" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Apply to Sheet</text>

  <!-- Note -->
  <text x="85" y="362" font-size="10" fill="#868e96">Rows with missing input block confirmation — close the modal, fill the red cells</text>
  <text x="85" y="376" font-size="10" fill="#868e96">on the sheet, then validate again.</text>
</svg>
