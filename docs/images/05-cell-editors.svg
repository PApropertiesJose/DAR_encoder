<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="400" fill="#f8f9fa"/>

  <!-- Blk & Lot modal -->
  <g>
    <rect x="25" y="30" width="260" height="330" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <text x="45" y="60" font-size="13" font-weight="700" fill="#212529">Select Block &amp; Lot  <tspan fill="#868e96" font-weight="400">⟳</tspan></text>
    <text x="270" y="58" font-size="12" fill="#adb5bd" text-anchor="end">✕</text>

    <text x="45" y="90" font-size="11" font-weight="600" fill="#212529">Block</text>
    <rect x="45" y="97" width="220" height="30" rx="6" fill="#ffffff" stroke="#00595c"/>
    <text x="56" y="116" font-size="11" fill="#212529">12</text>

    <text x="45" y="150" font-size="11" font-weight="600" fill="#212529">Lot</text>
    <rect x="45" y="157" width="220" height="30" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="56" y="176" font-size="11" fill="#212529">0004</text>

    <rect x="45" y="205" width="220" height="66" rx="6" fill="#e6f2f2"/>
    <text x="55" y="224" font-size="10" fill="#00595c">Pick a Block first — the Lot list is</text>
    <text x="55" y="238" font-size="10" fill="#00595c">filtered per block. Land Devt activities</text>
    <text x="55" y="252" font-size="10" fill="#00595c">are fixed at 000 / 0000 automatically.</text>

    <rect x="120" y="300" width="65" height="28" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="152" y="318" font-size="10" fill="#495057" text-anchor="middle">Cancel</text>
    <rect x="195" y="300" width="70" height="28" rx="6" fill="#00595c"/>
    <text x="230" y="318" font-size="10" fill="#ffffff" text-anchor="middle">Confirm</text>
  </g>

  <!-- Time picker modal -->
  <g>
    <rect x="315" y="30" width="260" height="330" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <text x="335" y="60" font-size="13" font-weight="700" fill="#212529">Select Time In</text>
    <text x="560" y="58" font-size="12" fill="#adb5bd" text-anchor="end">✕</text>

    <!-- Hour spinner -->
    <text x="392" y="105" font-size="12" fill="#868e96" text-anchor="middle">▲</text>
    <rect x="368" y="115" width="48" height="42" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="392" y="143" font-size="20" font-weight="700" font-family="Consolas, monospace" fill="#212529" text-anchor="middle">07</text>
    <text x="392" y="175" font-size="12" fill="#868e96" text-anchor="middle">▼</text>

    <text x="445" y="143" font-size="20" font-weight="700" fill="#212529" text-anchor="middle">:</text>

    <!-- Minute spinner -->
    <text x="498" y="105" font-size="12" fill="#868e96" text-anchor="middle">▲</text>
    <rect x="474" y="115" width="48" height="42" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="498" y="143" font-size="20" font-weight="700" font-family="Consolas, monospace" fill="#212529" text-anchor="middle">00</text>
    <text x="498" y="175" font-size="12" fill="#868e96" text-anchor="middle">▼</text>

    <text x="335" y="215" font-size="11" font-weight="600" fill="#212529">Or type directly (24-hour)</text>
    <rect x="335" y="222" width="220" height="30" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="346" y="241" font-size="11" font-family="Consolas, monospace" fill="#212529">07:00</text>

    <rect x="410" y="300" width="65" height="28" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="442" y="318" font-size="10" fill="#495057" text-anchor="middle">Cancel</text>
    <rect x="485" y="300" width="70" height="28" rx="6" fill="#00595c"/>
    <text x="520" y="318" font-size="10" fill="#ffffff" text-anchor="middle">Confirm</text>
  </g>

  <!-- Activity modal -->
  <g>
    <rect x="605" y="30" width="270" height="330" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <text x="625" y="60" font-size="13" font-weight="700" fill="#212529">Select Activity  <tspan fill="#868e96" font-weight="400">⟳</tspan></text>
    <text x="860" y="58" font-size="12" fill="#adb5bd" text-anchor="end">✕</text>

    <text x="625" y="90" font-size="11" font-weight="600" fill="#212529">Construction Index</text>
    <rect x="625" y="97" width="230" height="30" rx="6" fill="#ffffff" stroke="#00595c"/>
    <text x="636" y="116" font-size="11" fill="#212529">HOUSE CONSTRUCTION</text>

    <text x="625" y="150" font-size="11" font-weight="600" fill="#212529">Activity</text>
    <rect x="625" y="157" width="230" height="30" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <rect x="632" y="163" width="58" height="18" rx="9" fill="#e6fcf5"/>
    <text x="661" y="176" font-size="9" font-weight="700" fill="#12b886" text-anchor="middle">CHB-104</text>
    <text x="698" y="176" font-size="10" fill="#212529">CHB Laying 2nd Lift</text>

    <rect x="625" y="205" width="230" height="80" rx="6" fill="#e6f2f2"/>
    <text x="635" y="224" font-size="10" fill="#00595c">Pick the Construction Index first, then</text>
    <text x="635" y="238" font-size="10" fill="#00595c">search the activity by code, description</text>
    <text x="635" y="252" font-size="10" fill="#00595c">or title. Use ⟳ to resync the offline</text>
    <text x="635" y="266" font-size="10" fill="#00595c">activity list while online.</text>

    <rect x="710" y="300" width="65" height="28" rx="6" fill="#ffffff" stroke="#ced4da"/>
    <text x="742" y="318" font-size="10" fill="#495057" text-anchor="middle">Cancel</text>
    <rect x="785" y="300" width="70" height="28" rx="6" fill="#00595c"/>
    <text x="820" y="318" font-size="10" fill="#ffffff" text-anchor="middle">Confirm</text>
  </g>

  <!-- Captions -->
  <g font-size="11" font-weight="700" fill="#495057" text-anchor="middle">
    <text x="155" y="385">Blk &amp; Lot cell</text>
    <text x="445" y="385">TimeIn / TimeOut cells</text>
    <text x="740" y="385">Activity cell</text>
  </g>
</svg>
