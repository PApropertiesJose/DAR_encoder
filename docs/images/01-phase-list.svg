<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="430" fill="#f8f9fa"/>
  <!-- Page card -->
  <rect x="20" y="20" width="860" height="390" rx="12" fill="#ffffff" stroke="#dee2e6"/>

  <!-- Header -->
  <text x="45" y="60" font-size="22" font-weight="600" fill="#212529">Task Entries</text>
  <text x="45" y="80" font-size="11" font-family="Consolas, monospace" fill="#868e96">Phase</text>

  <!-- SYNCH PHASE button -->
  <rect x="700" y="42" width="150" height="34" rx="6" fill="none" stroke="#00595c" stroke-width="1.5"/>
  <text x="775" y="63" font-size="12" font-weight="600" fill="#00595c" text-anchor="middle">⟳  SYNCH PHASE</text>

  <line x1="45" y1="95" x2="855" y2="95" stroke="#dee2e6"/>

  <!-- Search input -->
  <text x="45" y="120" font-size="12" font-weight="500" fill="#212529">Search Phase</text>
  <rect x="45" y="128" width="340" height="34" rx="6" fill="#ffffff" stroke="#ced4da"/>
  <text x="57" y="149" font-size="12" fill="#adb5bd">Enter phase to search</text>

  <!-- Project cards -->
  <g>
    <rect x="45" y="185" width="190" height="150" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="45" y="185" width="190" height="8" rx="4" fill="#00595c"/>
    <text x="60" y="220" font-size="14" font-weight="700" fill="#00595c">PH-0012</text>
    <text x="60" y="242" font-size="11" fill="#495057">Northfield Residences</text>
    <text x="60" y="260" font-size="11" fill="#495057">Phase 2</text>
    <text x="60" y="285" font-size="10" fill="#868e96">📍 Sto. Tomas, Batangas</text>
  </g>
  <g>
    <rect x="255" y="185" width="190" height="150" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="255" y="185" width="190" height="8" rx="4" fill="#00595c"/>
    <text x="270" y="220" font-size="14" font-weight="700" fill="#00595c">PH-0034</text>
    <text x="270" y="242" font-size="11" fill="#495057">Southview Heights</text>
    <text x="270" y="260" font-size="11" fill="#495057">Phase 1-B</text>
    <text x="270" y="285" font-size="10" fill="#868e96">📍 Calamba, Laguna</text>
  </g>
  <g>
    <rect x="465" y="185" width="190" height="150" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="465" y="185" width="190" height="8" rx="4" fill="#00595c"/>
    <text x="480" y="220" font-size="14" font-weight="700" fill="#00595c">PH-0051</text>
    <text x="480" y="242" font-size="11" fill="#495057">Eastgate Village</text>
    <text x="480" y="260" font-size="11" fill="#495057">Phase 3</text>
    <text x="480" y="285" font-size="10" fill="#868e96">📍 Lipa, Batangas</text>
  </g>
  <g>
    <rect x="675" y="185" width="180" height="150" rx="10" fill="#ffffff" stroke="#dee2e6"/>
    <rect x="675" y="185" width="180" height="8" rx="4" fill="#00595c"/>
    <text x="690" y="220" font-size="14" font-weight="700" fill="#00595c">PH-0067</text>
    <text x="690" y="242" font-size="11" fill="#495057">Westwood Court</text>
    <text x="690" y="260" font-size="11" fill="#495057">Phase 1</text>
    <text x="690" y="285" font-size="10" fill="#868e96">📍 San Pablo, Laguna</text>
  </g>

  <!-- Callouts -->
  <rect x="45" y="355" width="810" height="36" rx="8" fill="#e6f2f2"/>
  <text x="60" y="378" font-size="12" fill="#00595c">💡 Click <tspan font-weight="700">SYNCH PHASE</tspan> while online to refresh the cached phase list. Click a card to open its calendar.</text>
</svg>
