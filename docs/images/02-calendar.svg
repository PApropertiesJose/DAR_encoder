<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#f8f9fa"/>
  <rect x="20" y="20" width="860" height="440" rx="12" fill="#ffffff" stroke="#dee2e6"/>

  <!-- Header -->
  <text x="45" y="58" font-size="20" font-weight="600" fill="#212529">Task Entries</text>
  <text x="45" y="77" font-size="11" font-family="Consolas, monospace"><tspan fill="#00595c">Phase</tspan><tspan fill="#adb5bd"> › </tspan><tspan fill="#868e96">Task Entries List</tspan></text>
  <line x1="45" y1="90" x2="855" y2="90" stroke="#dee2e6"/>

  <!-- Phase header -->
  <text x="45" y="118" font-size="13" font-weight="700" fill="#00595c">PH-0012 — Northfield Residences Phase 2</text>
  <line x1="45" y1="132" x2="855" y2="132" stroke="#dee2e6"/>

  <!-- Month nav -->
  <text x="45" y="160" font-size="14" font-weight="600" fill="#212529">July 2026</text>
  <text x="820" y="160" font-size="14" fill="#868e96">‹   ›</text>

  <!-- Weekday header -->
  <g font-size="10" fill="#868e96" text-anchor="middle" font-weight="600">
    <text x="105" y="185">MON</text><text x="220" y="185">TUE</text><text x="335" y="185">WED</text>
    <text x="450" y="185">THU</text><text x="565" y="185">FRI</text><text x="680" y="185">SAT</text><text x="795" y="185">SUN</text>
  </g>

  <!-- Calendar grid: 4 rows x 7 cols -->
  <g stroke="#e9ecef" fill="none">
    <rect x="48" y="195" width="805" height="224"/>
    <line x1="48" y1="251" x2="853" y2="251"/>
    <line x1="48" y1="307" x2="853" y2="307"/>
    <line x1="48" y1="363" x2="853" y2="363"/>
    <line x1="163" y1="195" x2="163" y2="419"/>
    <line x1="278" y1="195" x2="278" y2="419"/>
    <line x1="393" y1="195" x2="393" y2="419"/>
    <line x1="508" y1="195" x2="508" y2="419"/>
    <line x1="623" y1="195" x2="623" y2="419"/>
    <line x1="738" y1="195" x2="738" y2="419"/>
  </g>

  <!-- Day numbers row 1: 6-12 -->
  <g font-size="10" fill="#495057">
    <text x="56" y="209">6</text><text x="171" y="209">7</text><text x="286" y="209">8</text><text x="401" y="209">9</text>
    <text x="516" y="209">10</text><text x="631" y="209">11</text><text x="746" y="209">12</text>
    <text x="56" y="265">13</text><text x="171" y="265">14</text><text x="286" y="265">15</text><text x="401" y="265">16</text>
    <text x="516" y="265">17</text><text x="631" y="265">18</text><text x="746" y="265">19</text>
    <text x="56" y="321">20</text><text x="171" y="321">21</text><text x="286" y="321">22</text><text x="401" y="321">23</text>
    <text x="516" y="321">24</text><text x="631" y="321">25</text><text x="746" y="321">26</text>
    <text x="56" y="377">27</text><text x="171" y="377">28</text><text x="286" y="377">29</text><text x="401" y="377">30</text>
    <text x="516" y="377">31</text>
  </g>

  <!-- Encoded event chips -->
  <g font-size="9" font-weight="600" fill="#ffffff">
    <rect x="53" y="222" width="104" height="18" rx="4" fill="#12b886"/>
    <text x="105" y="234" text-anchor="middle">Encoded</text>
    <rect x="168" y="222" width="104" height="18" rx="4" fill="#12b886"/>
    <text x="220" y="234" text-anchor="middle">Encoded</text>
    <rect x="53" y="278" width="104" height="18" rx="4" fill="#12b886"/>
    <text x="105" y="290" text-anchor="middle">Encoded</text>
  </g>

  <!-- Highlighted day being clicked -->
  <rect x="278" y="251" width="115" height="56" fill="#00595c" fill-opacity="0.08" stroke="#00595c" stroke-width="1.5"/>
  <g>
    <circle cx="336" cy="280" r="12" fill="#00595c"/>
    <text x="336" y="284" font-size="11" fill="#ffffff" text-anchor="middle">👆</text>
  </g>

  <!-- Callout -->
  <rect x="45" y="428" width="810" height="24" rx="6" fill="#e6f2f2"/>
  <text x="60" y="444" font-size="11" fill="#00595c">💡 Teal <tspan font-weight="700">Encoded</tspan> chips mark dates that already contain saved entries. Click any day to open its entry form.</text>
</svg>
